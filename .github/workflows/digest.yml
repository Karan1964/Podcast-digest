name: Podcast Digest

# Runs on its schedule, when you press "Run workflow", or when the owner pushes
# a change to run-now.txt (lets Claude start a run). No pull_request triggers,
# so outside contributors can never reach the secrets.
on:
  push:
    branches: [main]
    paths: [run-now.txt]
  schedule:
    - cron: "7 2 * * *"   # 07:37 IST daily
  workflow_dispatch:
    inputs:
      mode:
        description: "daily = new videos only; latest_per_channel = test with each channel's newest video"
        type: choice
        options: [daily, latest_per_channel]
        default: daily

permissions:
  contents: write          # to commit state.json (list of processed video IDs)

concurrency:
  group: podcast-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.PODCAST_TELEGRAM_BOT_TOKEN || secrets.PODCAST_TELEGRAM_TOKEN || secrets.PODCAST_TELEGRAM_BOT || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT }}
          TEST_LATEST: ${{ (github.event.inputs.mode == 'latest_per_channel' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[latest]'))) && '1' || '' }}
        run: python podcast_digest.py

      - name: Save state
        if: always()
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update processed videos [skip ci]"
          git push
